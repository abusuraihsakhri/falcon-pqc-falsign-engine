[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-pqc-falsign-engine"
version = "2.0.0"
description = "FN-DSA / Falcon Fast-Fourier Lattice-Based Signature Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1"]\n\n[project.optional-dependencies]\ndev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
falcon-pqc-falsign-engine = "falcon_engine.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/falcon-pqc-falsign-engine"
Repository = "https://github.com/abusuraihsakhri/falcon-pqc-falsign-engine.git"
