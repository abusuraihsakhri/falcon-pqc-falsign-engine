name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile modules
        run: python -m compileall -q agents falcon_engine cli.py enrichment.py simulator.py
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.DOTALL)
          assert len(scripts) == 1
          Path("/tmp/falcon-console.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/falcon-console.js
      - name: Run regression tests
        run: python -m pytest -q
